name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the tests never need to write to the repo.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Raspberry Pi
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # No Discord token, ARK server or network share is needed.
        run: python -B -m unittest discover -s tests -v
